<div class="container mt-3">
  <h3>Medicamentos</h3>

  <div class="card p-3 my-3 bg-light">
    <h5>Agregar Nuevo Medicamento</h5>
    <div class="row g-2">
      <div class="col-md-3">
        <input
          type="text"
          class="form-control"
          placeholder="Nombre del medicamento"
          [(ngModel)]="nuevoNombre"
        />
      </div>
      <div class="col-md-3">
        <input
          type="text"
          class="form-control"
          placeholder="Categoría"
          [(ngModel)]="nuevaCategoria"
        />
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control" placeholder="Stock" [(ngModel)]="nuevoStock" />
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-primary w-100" (click)="agregarMedicamento()">
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <table class="table mt-4">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        @for (medicamento of listaMedicamentos; track $index) {
          <tr>
            <td>{{ medicamento.nombre }}</td>
            <td>{{ medicamento.categoria }}</td>
            <td>{{ medicamento.stock }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
