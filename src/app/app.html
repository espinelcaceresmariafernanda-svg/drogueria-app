<div class="container mt-4">
  <h3>Medicamentos</h3>

  <div class="card p-4 my-3">
    <h5>Agregar Nuevo Medicamento</h5>
    <div class="row g-3">
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          placeholder="Nombre del medicamento"
          [(ngModel)]="nuevoNombre"
        />
      </div>
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          placeholder="Categoría"
          [(ngModel)]="nuevaCategoria"
        />
      </div>
      <div class="col-md-4">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Stock" 
          [(ngModel)]="nuevoStock" 
        />
      </div>
      <div class="col-12 mt-3">
        <button type="button" class="btn btn-primary w-100" (click)="agregarMedicamento()">
          + Agregar Medicamento
        </button>
      </div>
    </div>
  </div>

  <div class="table-responsive mt-4">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        @for (medicamento of listaMedicamentos; track $index) {
          <tr>
            <td class="fw-medium">{{ medicamento.nombre }}</td>
            <td><span class="badge bg-light text-primary border border-info-subtle">{{ medicamento.categoria }}</span></td>
            <td>{{ medicamento.stock }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
